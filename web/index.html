<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="description" content="GarageLog - Vehicle service & fuel tracker for motorcycles and cars.">

  <!-- iOS meta tags & icons -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="GarageLog">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>GarageLog</title>
  <link rel="manifest" href="manifest.json">
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background-color: #FFFFFF;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    #gl-splash {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background-color: #FFFFFF;
      z-index: 9999;
      transition: opacity 0.28s ease;
    }
    #gl-splash.hidden {
      opacity: 0;
      pointer-events: none;
    }
    #gl-splash img {
      width: 184px;
      height: 184px;
      border-radius: 28px;
      object-fit: contain;
    }
    .gl-bar-track {
      width: 144px;
      height: 4.5px;
      margin-top: 22px;
      border-radius: 999px;
      background: rgba(11, 34, 65, 0.12);
      overflow: hidden;
    }
    .gl-bar-fill {
      width: 45%;
      height: 100%;
      border-radius: 999px;
      background: linear-gradient(90deg, #0B2241 0%, #F55E00 100%);
      animation: gl-slide 1.1s ease-in-out infinite;
    }
    @keyframes gl-slide {
      0% { transform: translateX(-110%); }
      100% { transform: translateX(240%); }
    }
  </style>
</head>
<body>
  <div id="gl-splash">
    <img src="icons/Icon-512.png" alt="GarageLog">
    <div class="gl-bar-track">
      <div class="gl-bar-fill"></div>
    </div>
  </div>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      var el = document.getElementById('gl-splash');
      if (el) {
        el.classList.add('hidden');
        setTimeout(function () { el.remove(); }, 320);
      }
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
